plugins {
    id 'com.android.application'
}

android {
    namespace 'chat.tele.app'
    compileSdk 36

    defaultConfig {
        applicationId 'chat.tele.app'
        minSdk 24
        targetSdk 36
        versionCode 3
        versionName '1.2.0'
    }
    signingConfigs {
        release {
            def keystorePath = System.getenv('TELECHAT_KEYSTORE_PATH')
            if (keystorePath) {
                storeFile file(keystorePath)
                storePassword System.getenv('TELECHAT_KEYSTORE_PASSWORD')
                keyAlias System.getenv('TELECHAT_KEY_ALIAS')
                keyPassword System.getenv('TELECHAT_KEY_PASSWORD')
            }
        }
    }

    buildTypes {
        debug {
            applicationIdSuffix '.debug'
            versionNameSuffix '-debug'
        }
        release {
            minifyEnabled true
            shrinkResources true
            signingConfig signingConfigs.release
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
        }
    }
}
